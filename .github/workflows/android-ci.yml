name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify repository structure
        shell: bash
        run: |
          required_paths=(
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "settings.gradle.kts"
          )
          missing=()
          for path in "${required_paths[@]}"; do
            [[ -e "$path" ]] || missing+=("$path")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Incomplete Android project::Required project files are missing from the repository root."
            printf 'Missing: %s\n' "${missing[@]}"
            echo "Upload the CONTENTS of the ascend-system folder, including the complete app directory, to the repository root."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run JVM unit tests
        run: ./gradlew clean testConsumerDebugUnitTest testDedicatedDebugUnitTest --max-workers=1 --stacktrace

      - name: Run Android lint
        run: ./gradlew lintConsumerDebug lintDedicatedDebug --stacktrace

      - name: Build debug APKs
        run: ./gradlew assembleConsumerDebug assembleDedicatedDebug --stacktrace

      - name: Upload consumer APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-consumer-debug-apk
          path: app/build/outputs/apk/consumer/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload dedicated APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-dedicated-debug-apk
          path: app/build/outputs/apk/dedicated/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascend-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
